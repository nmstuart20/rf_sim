# Minimal scenario: one static CW emitter, one receiver with one channel, and one
# antenna-port output at the same antenna.
# Lint it with: sim lint examples/minimal.toml
# Run it with:  sim run --offline examples/minimal.toml --out /tmp/minimal

schema_version = 1
epoch = 2026-01-01T00:00:00Z
seed = 1
run_mode = "offline"

[metadata]
name = "minimal"
description = "One static CW emitter at 1090 MHz seen by one receiver."

[render]
duration = "10 ms"
block = "1 ms"

[[platforms]]
name = "beacon"
position = { lat = "38°55'00.0\"N", lon = "77°02'11.5\"W", alt = "10 m AGL" }

[[platforms]]
name = "site"
position = { mgrs = "18SUJ2337106519", alt = "25 m MSL" }
mounts = [{ name = "mast", antenna = "isotropic" }]

[[emitters]]
name = "cw"
platform = "beacon"
frequency = "1090 MHz"
power = "30 dBm"
behavior = "always_on"
waveform = "cw"

[[receivers]]
name = "rx"
platform = "site"
mount = "mast"

[[receivers.channels]]
name = "ch0"
center_frequency = "1090 MHz"
sample_rate = "10 MS/s"
bandwidth = "8 MHz"
front_end = { gain = "30 dB", noise_figure = "5 dB" }
adc = { full_scale = "-30 dBm", bits = 16 }
sinks = ["recording"]

[[antenna_ports]]
name = "port"
platform = "site"
mount = "mast"
center_frequency = "1090 MHz"
sample_rate = "10 MS/s"
bandwidth = "8 MHz"
full_scale = "-40 dBm"
sinks = ["port_recording"]

[[sinks]]
name = "recording"
kind = "sigmf"
resources = ["scratch_disk"]

[[sinks]]
name = "port_recording"
kind = "sigmf"
resources = ["scratch_disk"]

[[resources]]
name = "scratch_disk"
kind = "disk"
capacity = "400 MB/s"
